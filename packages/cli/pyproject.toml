[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-cli"
version = "0.4.0"
description = "Local and CI adapter for AgentGuard Core"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AgentGuard Project"}]
dependencies = [
  "agentguard-core==0.4.0",
  "typer>=0.16,<1",
  "rich>=13.9,<15"
]

[project.scripts]
agentguard = "agentguard_cli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
